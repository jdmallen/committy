name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # committy publishes single-file and untrimmed (not Native AOT), so there are
  # no trim warnings to gate on; this just proves the release publish still
  # succeeds before a PR reaches main and the release workflow.
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file (linux-x64)
        run: |
          dotnet publish src/JDMallen.Committy/JDMallen.Committy.csproj \
            -c Release -r linux-x64 -o publish-out
