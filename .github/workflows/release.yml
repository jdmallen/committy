# Releases a new version whenever a commit lands on main (e.g. a merged PR)
# with a <Version> in Directory.Build.props that hasn't been tagged yet:
#   1. runs the test suite, so a failing commit never ships,
#   2. builds the Native AOT release archives with scripts/publish.sh, each on
#      a runner of its own OS (AOT cannot cross-compile between operating
#      systems, nor between architectures on Linux),
#   3. tags the pushed commit with the raw semver (no 'v' prefix), and
#   4. creates a GitHub release whose notes are that version's CHANGELOG.md
#      section, with the archives and a SHA256SUMS.txt attached.
# (Tagging and release creation are one atomic gh call, ordered after the
# tests and builds so a failed run never leaves a dangling tag.)
# If the version's tag already exists, the run is a no-op, so routine merges
# that don't bump <Version> never re-release.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.tag_check.outputs.exists }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from Directory.Build.props
        id: version
        run: |
          version="$(grep -oP '(?<=<Version>)[^<]+' \
            Directory.Build.props | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::No <Version> found in Directory.Build.props." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Skip if tag already exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists; skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET SDK
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests
        if: steps.tag_check.outputs.exists == 'false'
        run: dotnet test --configuration Release

  # The Linux builds run on ubuntu-22.04 on purpose: an AOT binary needs at
  # least the glibc it was linked against, so this image (glibc 2.35) sets the
  # oldest distro users can run. Don't move them to ubuntu-latest.
  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            runtimes: linux-x64
          - runner: ubuntu-22.04-arm
            runtimes: linux-arm64
          - runner: windows-latest
            runtimes: win-x64 win-arm64
          - runner: macos-latest
            runtimes: osx-x64 osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish release binaries
        shell: bash
        run: ./scripts/publish.sh ${{ matrix.runtimes }}

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract changelog section for this version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && (/^## \[/ || /^\[/)  { in_section = 0 }
            in_section { print }
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "::error::No section for version $VERSION found in CHANGELOG.md." >&2
            exit 1
          fi
          echo "--- Release notes ---"
          cat release_notes.md

      # Creating the release also creates the tag (raw semver, no 'v' prefix)
      # on the pushed commit. Tagging happens here, after every build
      # succeeded, so a failed publish never leaves a tag without a release.
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
